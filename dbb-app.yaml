version: 1.0.0
application:
  name: MortgageApplication
  tasks:

    # Variable overrides for the ImpactAnalysis task
    - task: ImpactAnalysis
      variables:
        - name: impactQueryPatterns
          value:
            # Cobol normal
            - languageExt: cbl
              dependencyPatterns:
                - ${APP_DIR_NAME}/copybook/*.cpy
                - ${APP_DIR_NAME}/bms/*.bms
                - ${APP_DIR_NAME}/cobol/*.cbl

            # Cobol compilado pela Compuware
            - languageExt: cbcw
              dependencyPatterns:
                - ${APP_DIR_NAME}/copybook/*.cpy
                - ${APP_DIR_NAME}/bms/*.bms
                - ${APP_DIR_NAME}/cobol/*.cbl
                - ${APP_DIR_NAME}/cobol/*.cbcw

            # Link card
            - languageExt: lnk
              dependencyPatterns:
                - ${APP_DIR_NAME}/cobol/*.cbl
                - ${APP_DIR_NAME}/cobol/*.cbcw
    # Variable overrides for the Cobol language task
    - task: Cobol
      variables:  
        # Need to build sub-module epsnbrvl.cbl first during cobol builds
        - name: fileBuildRank
          value: 1
          forFiles: "**/cobol/epsnbrvl.cbl"

        # Skip creating a load module for these programs as they will be 
        # statically linked to other programs
        - name: doLinkEdit
          value: false
          forFiles:
            - "**/cobol/epsnbrvl.cbl"
            - "**/cobol/epsmlist.cbl"   

    # Variable overrides for the LinkEdit language task
    - task: LinkEdit
      variables: 
        # Set flag for link cards with CICS load modules
        - name: hasCICSModules
          value: true
          forFiles:
            - "**/link/epsmlist.lnk"
    
    # Variable overrides for the ScanLoadModule task
    - task: ScanLoadModule
      variables:
        - name: skipScan
          value: true
          forFiles:
            - "**/cobol/epsnbrvl.cbl"
            - "**/cobol/epsmlist.cbl"
            - "**/copybook/**"
            - "**/bms/**"
    
    - task: ScannerInit
      variables:
        - name: scanners
          value:
            - scanner: COBOL
              extensions: "cbl,cob,cobol,cbcw"

