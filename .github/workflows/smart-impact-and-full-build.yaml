name: IDzEE Impact and Full Build

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      build_type:
        description: "Tipo de build"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - impact
          - full


jobs:

  build:

    runs-on:
      - self-hosted
      - Linux
      - ARM64

    env:

      ZOS_HOST: ${{ secrets.ZOS_HOST }}
      ZOS_PORT: ${{ secrets.ZOS_PORT }}
      ZOS_USER: ${{ secrets.ZOS_USER }}
      ZOS_PASSWORD: ${{ secrets.ZOS_PASSWORD }}

      APP_NAME: idzee-pipeline

      # Acima deste número de arquivos relevantes alterados,
      # o pipeline utiliza Full Build.
      IMPACT_BUILD_LIMIT: 10


    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2


      # ============================================================
      # 2. VERIFICAR RUNNER
      # ============================================================

      - name: Verificar ambiente
        shell: bash
        run: |

          echo "=========================================="
          echo "AMBIENTE DO RUNNER"
          echo "=========================================="

          echo "Hostname:"
          hostname

          echo
          echo "Node:"
          node --version

          echo
          echo "Zowe:"
          zowe --version


      # ============================================================
      # 3. DEFINIR AMBIENTE DBB
      # ============================================================

      - name: Definir ambiente DBB
        shell: bash
        run: |

          USS_USER="${ZOS_USER,,}"
          DBB_HLQ="${ZOS_USER}.DBB"
          DBB_ROOT="/u/${USS_USER}/dbb"

          echo "USS_USER=$USS_USER" >> "$GITHUB_ENV"
          echo "DBB_HLQ=$DBB_HLQ" >> "$GITHUB_ENV"
          echo "DBB_ROOT=$DBB_ROOT" >> "$GITHUB_ENV"


      # ============================================================
      # 4. ANALISAR ALTERAÇÕES
      # ============================================================

      - name: Analisar alterações
        shell: bash
        run: |

          echo "=========================================="
          echo "ANÁLISE DAS ALTERAÇÕES"
          echo "=========================================="

          # --------------------------------------------------------
          # Tipo de build solicitado
          # --------------------------------------------------------

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then

            REQUESTED_BUILD="${{ github.event.inputs.build_type }}"

          else

            REQUESTED_BUILD="auto"

          fi

          echo "Modo solicitado: $REQUESTED_BUILD"


          # --------------------------------------------------------
          # Identificar arquivos alterados
          # --------------------------------------------------------

          if git rev-parse HEAD^ >/dev/null 2>&1; then

            # Arquivos adicionados, copiados, modificados ou renomeados
            git diff \
              --name-only \
              --diff-filter=ACMR \
              HEAD^ HEAD \
              > changed-files.txt

            # Arquivos removidos
            git diff \
              --name-only \
              --diff-filter=D \
              HEAD^ HEAD \
              > deleted-files.txt

          else

            # Primeiro commit / histórico indisponível
            git ls-files > changed-files.txt
            : > deleted-files.txt

          fi


          echo
          echo "Arquivos adicionados/modificados:"
          echo "------------------------------------------"

          cat changed-files.txt || true

          echo "------------------------------------------"

          echo
          echo "Arquivos removidos:"
          echo "------------------------------------------"

          cat deleted-files.txt || true

          echo "------------------------------------------"


          # --------------------------------------------------------
          # Arquivos relevantes para o build
          #
          # COBOL
          # Compuware COBOL
          # Copybook
          # BMS
          # --------------------------------------------------------

          grep -Ei '\.(cbl|cbcw|cpy|bms)$' \
            changed-files.txt \
            > changed-build-files.txt || true


          # --------------------------------------------------------
          # Contadores
          # --------------------------------------------------------

          BUILD_FILE_COUNT=$(wc -l < changed-build-files.txt)
          CHANGED_COUNT=$(wc -l < changed-files.txt)
          DELETED_COUNT=$(wc -l < deleted-files.txt)

          BUILD_FILE_COUNT=$(echo "$BUILD_FILE_COUNT" | tr -d ' ')
          CHANGED_COUNT=$(echo "$CHANGED_COUNT" | tr -d ' ')
          DELETED_COUNT=$(echo "$DELETED_COUNT" | tr -d ' ')


          echo
          echo "Arquivos alterados : $CHANGED_COUNT"
          echo "Arquivos removidos : $DELETED_COUNT"
          echo "Arquivos de build  : $BUILD_FILE_COUNT"


          # --------------------------------------------------------
          # Detectar alteração de configuração DBB
          # --------------------------------------------------------

          CONFIG_CHANGED=false

          if grep -Eq \
            '(^|/)(dbb-app\.yaml|dbb-build\.yaml)$' \
            changed-files.txt; then

            CONFIG_CHANGED=true

          fi

          echo "Configuração DBB alterada: $CONFIG_CHANGED"


          # ========================================================
          # DECISÃO DO BUILD
          # ========================================================

          BUILD_TYPE="$REQUESTED_BUILD"
          BUILD_REASON=""


          # --------------------------------------------------------
          # Modo automático
          # --------------------------------------------------------

          if [[ "$BUILD_TYPE" == "auto" ]]; then


            # ------------------------------------------------------
            # REGRA 1
            # Configuração DBB alterada
            # ------------------------------------------------------

            if [[ "$CONFIG_CHANGED" == "true" ]]; then

              BUILD_TYPE="full"
              BUILD_REASON="Configuração DBB alterada"


            # ------------------------------------------------------
            # REGRA 2
            # Arquivo removido
            # ------------------------------------------------------

            elif [[ "$DELETED_COUNT" -gt 0 ]]; then

              BUILD_TYPE="full"
              BUILD_REASON="Arquivo removido do repositório"


            # ------------------------------------------------------
            # REGRA 3
            # Muitas alterações
            # ------------------------------------------------------

            elif [[ "$BUILD_FILE_COUNT" -gt "$IMPACT_BUILD_LIMIT" ]]; then

              BUILD_TYPE="full"
              BUILD_REASON="Mais de ${IMPACT_BUILD_LIMIT} arquivos relevantes alterados"


            # ------------------------------------------------------
            # REGRA 4
            # Alterações para Impact Analysis
            # ------------------------------------------------------

            elif [[ "$BUILD_FILE_COUNT" -gt 0 ]]; then

              BUILD_TYPE="impact"
              BUILD_REASON="${BUILD_FILE_COUNT} arquivo(s) relevante(s) alterado(s)"


            # ------------------------------------------------------
            # REGRA 5
            # Nada relevante
            # ------------------------------------------------------

            else

              BUILD_TYPE="none"
              BUILD_REASON="Nenhum arquivo relevante para build alterado"

            fi


          # --------------------------------------------------------
          # Full solicitado manualmente
          # --------------------------------------------------------

          elif [[ "$BUILD_TYPE" == "full" ]]; then

            BUILD_REASON="Full Build solicitado manualmente"


          # --------------------------------------------------------
          # Impact solicitado manualmente
          # --------------------------------------------------------

          elif [[ "$BUILD_TYPE" == "impact" ]]; then

            BUILD_REASON="Impact Build solicitado manualmente"

          fi


          echo
          echo "=========================================="
          echo "DECISÃO"
          echo "=========================================="
          echo "Build  : $BUILD_TYPE"
          echo "Motivo : $BUILD_REASON"
          echo "=========================================="


          echo "BUILD_TYPE=$BUILD_TYPE" >> "$GITHUB_ENV"
          echo "BUILD_REASON=$BUILD_REASON" >> "$GITHUB_ENV"

          echo "BUILD_FILE_COUNT=$BUILD_FILE_COUNT" >> "$GITHUB_ENV"
          echo "CHANGED_COUNT=$CHANGED_COUNT" >> "$GITHUB_ENV"
          echo "DELETED_COUNT=$DELETED_COUNT" >> "$GITHUB_ENV"


      # ============================================================
      # 5. PLANO DE EXECUÇÃO
      # ============================================================

      - name: Plano de execução
        shell: bash
        run: |

          echo "=========================================="
          echo "IDzEE IMPACT / FULL BUILD"
          echo "=========================================="

          echo "Aplicação : $APP_NAME"
          echo "Usuário   : $ZOS_USER"
          echo "HLQ       : $DBB_HLQ"
          echo "USS       : $DBB_ROOT/$APP_NAME"

          echo
          echo "Alterados   : $CHANGED_COUNT"
          echo "Removidos   : $DELETED_COUNT"
          echo "Build files : $BUILD_FILE_COUNT"

          echo
          echo "Build     : $BUILD_TYPE"
          echo "Motivo    : $BUILD_REASON"

          echo "=========================================="


      # ============================================================
      # 6. CONFIGURAR UPLOAD
      # ============================================================

      - name: Configurar upload
        if: env.BUILD_TYPE != 'none'
        shell: bash
        run: |

          cat > .zosattributes <<'EOF'
          .git/        -
          .github/     -
          .DS_Store    -
          EOF


      # ============================================================
      # 7. PREPARAR WORKSPACE NO Z/OS
      #
      # IMPORTANTE:
      # O workspace não é removido.
      # Impact Build depende da baseline Git existente.
      # ============================================================

      - name: Preparar workspace no z/OS
        if: env.BUILD_TYPE != 'none'
        shell: bash
        run: |

          echo "=========================================="
          echo "PREPARANDO WORKSPACE"
          echo "=========================================="

          PREP_CMD="\
            mkdir -p '${DBB_ROOT}/logs' && \
            mkdir -p '${DBB_ROOT}/${APP_NAME}'"

          zowe rse-api-for-zowe-cli issue unix-shell \
            --cwd "/u" \
            "$PREP_CMD" \
            --host "$ZOS_HOST" \
            --port "$ZOS_PORT" \
            --user "$ZOS_USER" \
            --password "$ZOS_PASSWORD"


      # ============================================================
      # 8A. FULL - UPLOAD COMPLETO
      # ============================================================

      - name: Upload completo para o z/OS
        if: env.BUILD_TYPE == 'full'
        shell: bash
        run: |

          echo "=========================================="
          echo "FULL UPLOAD"
          echo "=========================================="

          echo "Enviando repositório completo para:"
          echo "$DBB_ROOT/$APP_NAME"

          zowe rse-api-for-zowe-cli upload dir-to-uss \
            "." \
            "${DBB_ROOT}/${APP_NAME}" \
            --recursive \
            --attributes .zosattributes \
            --max-concurrent-requests 5 \
            --host "$ZOS_HOST" \
            --port "$ZOS_PORT" \
            --user "$ZOS_USER" \
            --password "$ZOS_PASSWORD"


      # ============================================================
      # 8B. IMPACT - UPLOAD INCREMENTAL
      # ============================================================

      - name: Upload incremental para o z/OS
        if: env.BUILD_TYPE == 'impact'
        shell: bash
        run: |

          echo "=========================================="
          echo "IMPACT - UPLOAD INCREMENTAL"
          echo "=========================================="

          echo "Arquivos que serão sincronizados:"
          cat changed-files.txt

          echo

          while IFS= read -r FILE
          do

            [[ -z "$FILE" ]] && continue

            LOCAL_FILE="$FILE"
            REMOTE_FILE="${DBB_ROOT}/${APP_NAME}/${FILE}"
            REMOTE_DIR=$(dirname "$REMOTE_FILE")


            echo "------------------------------------------"
            echo "Arquivo:"
            echo "$LOCAL_FILE"

            echo
            echo "Destino:"
            echo "$REMOTE_FILE"
            echo "------------------------------------------"


            # ------------------------------------------------------
            # Criar diretório remoto
            # ------------------------------------------------------

            zowe rse-api-for-zowe-cli issue unix-shell \
              --cwd "${DBB_ROOT}/${APP_NAME}" \
              "mkdir -p '${REMOTE_DIR}'" \
              --host "$ZOS_HOST" \
              --port "$ZOS_PORT" \
              --user "$ZOS_USER" \
              --password "$ZOS_PASSWORD"


            # ------------------------------------------------------
            # Upload do arquivo
            # ------------------------------------------------------

            zowe rse-api-for-zowe-cli upload file-to-uss \
              "$LOCAL_FILE" \
              "$REMOTE_FILE" \
              --host "$ZOS_HOST" \
              --port "$ZOS_PORT" \
              --user "$ZOS_USER" \
              --password "$ZOS_PASSWORD"


          done < changed-files.txt


      # ============================================================
      # 9. VERIFICAR WORKSPACE
      # ============================================================

      - name: Verificar arquivos no USS
        if: env.BUILD_TYPE != 'none'
        shell: bash
        run: |

          echo "=========================================="
          echo "VERIFICANDO WORKSPACE"
          echo "=========================================="

          zowe rse-api-for-zowe-cli issue unix-shell \
            --cwd "${DBB_ROOT}/${APP_NAME}" \
            "pwd && \
             ls -la && \
             test -f dbb-app.yaml && \
             echo 'dbb-app.yaml encontrado'" \
            --host "$ZOS_HOST" \
            --port "$ZOS_PORT" \
            --user "$ZOS_USER" \
            --password "$ZOS_PASSWORD"


      # ============================================================
      # 10. PREPARAR GIT PARA FULL BUILD
      #
      # Full Build cria uma nova baseline.
      #
      # O DBB exige um repositório Git válido com HEAD.
      # ============================================================

      - name: Preparar Git para Full Build
        if: env.BUILD_TYPE == 'full'
        shell: bash
        run: |

          echo "=========================================="
          echo "CRIANDO BASELINE GIT"
          echo "=========================================="

          zowe rse-api-for-zowe-cli issue unix-shell \
            --cwd "${DBB_ROOT}/${APP_NAME}" \
            ". ~/.profile && \
             rm -rf .git && \
             git init && \
             git add . && \
             git -c user.name='IDzEE Pipeline' \
                 -c user.email='idzee-pipeline@local' \
                 commit -m 'Full Build baseline ${GITHUB_SHA}'" \
            --host "$ZOS_HOST" \
            --port "$ZOS_PORT" \
            --user "$ZOS_USER" \
            --password "$ZOS_PASSWORD"


      # ============================================================
      # 11. VERIFICAR BASELINE PARA IMPACT
      #
      # Impact só pode ocorrer se existir:
      #
      #   .git
      #   HEAD
      #
      # ============================================================

      - name: Verificar baseline Git para Impact
        if: env.BUILD_TYPE == 'impact'
        shell: bash
        run: |

          echo "=========================================="
          echo "VERIFICANDO BASELINE GIT"
          echo "=========================================="

          zowe rse-api-for-zowe-cli issue unix-shell \
            --cwd "${DBB_ROOT}/${APP_NAME}" \
            ". ~/.profile && \
             test -d .git && \
             git rev-parse --verify HEAD && \
             echo 'Baseline Git encontrada.' && \
             echo 'HEAD atual:' && \
             git log -1 --oneline && \
             echo && \
             echo 'Alterações no working tree:' && \
             git status --short" \
            --host "$ZOS_HOST" \
            --port "$ZOS_PORT" \
            --user "$ZOS_USER" \
            --password "$ZOS_PASSWORD"


      # ============================================================
      # 12. FULL BUILD
      # ============================================================

      - name: Executar DBB Full Build
        if: env.BUILD_TYPE == 'full'
        shell: bash
        run: |

          echo "=========================================="
          echo "FULL BUILD"
          echo "=========================================="
          echo "Motivo: $BUILD_REASON"
          echo "=========================================="

          zowe rse-api-for-zowe-cli issue unix-shell \
            --cwd "${DBB_ROOT}/${APP_NAME}" \
            ". ~/.profile && \
             \$DBB_HOME/bin/dbb build full \
             --hlq ${DBB_HLQ}" \
            --host "$ZOS_HOST" \
            --port "$ZOS_PORT" \
            --user "$ZOS_USER" \
            --password "$ZOS_PASSWORD"


      # ============================================================
      # 13. IMPACT BUILD
      #
      # Nesse momento:
      #
      # HEAD         = baseline anterior
      # Working tree = arquivos novos enviados pela pipeline
      #
      # O DBB pode executar a análise de impacto.
      # ============================================================

      - name: Executar DBB Impact Build
        if: env.BUILD_TYPE == 'impact'
        shell: bash
        run: |

          echo "=========================================="
          echo "IMPACT BUILD"
          echo "=========================================="
          echo "Motivo: $BUILD_REASON"
          echo "=========================================="

          zowe rse-api-for-zowe-cli issue unix-shell \
            --cwd "${DBB_ROOT}/${APP_NAME}" \
            ". ~/.profile && \
             \$DBB_HOME/bin/dbb build impact \
             --hlq ${DBB_HLQ}" \
            --host "$ZOS_HOST" \
            --port "$ZOS_PORT" \
            --user "$ZOS_USER" \
            --password "$ZOS_PASSWORD"


      # ============================================================
      # 14. ATUALIZAR BASELINE APÓS IMPACT
      #
      # Esse step só executa se o Impact Build anterior terminar
      # com sucesso.
      #
      # A versão atual passa a ser a nova baseline.
      # ============================================================

      - name: Atualizar baseline Git após Impact
        if: env.BUILD_TYPE == 'impact'
        shell: bash
        run: |

          echo "=========================================="
          echo "ATUALIZANDO BASELINE GIT"
          echo "=========================================="

          zowe rse-api-for-zowe-cli issue unix-shell \
            --cwd "${DBB_ROOT}/${APP_NAME}" \
            ". ~/.profile && \
             git add -A && \
             git -c user.name='IDzEE Pipeline' \
                 -c user.email='idzee-pipeline@local' \
                 commit -m 'Impact Build baseline ${GITHUB_SHA}' || true" \
            --host "$ZOS_HOST" \
            --port "$ZOS_PORT" \
            --user "$ZOS_USER" \
            --password "$ZOS_PASSWORD"


      # ============================================================
      # 15. MOSTRAR BASELINE ATUAL
      # ============================================================

      - name: Mostrar baseline atual
        if: env.BUILD_TYPE != 'none'
        shell: bash
        run: |

          echo "=========================================="
          echo "BASELINE GIT ATUAL"
          echo "=========================================="

          zowe rse-api-for-zowe-cli issue unix-shell \
            --cwd "${DBB_ROOT}/${APP_NAME}" \
            ". ~/.profile && \
             git log -1 --oneline && \
             echo && \
             git status --short" \
            --host "$ZOS_HOST" \
            --port "$ZOS_PORT" \
            --user "$ZOS_USER" \
            --password "$ZOS_PASSWORD"


      # ============================================================
      # 16. NENHUM BUILD
      # ============================================================

      - name: Nenhum build necessário
        if: env.BUILD_TYPE == 'none'
        shell: bash
        run: |

          echo "=========================================="
          echo "BUILD IGNORADO"
          echo "=========================================="
          echo "$BUILD_REASON"


      # ============================================================
      # 17. RESUMO
      # ============================================================

      - name: Resumo da execução
        if: always()
        shell: bash
        run: |

          echo "=========================================="
          echo "RESUMO - IDzEE IMPACT / FULL BUILD"
          echo "=========================================="

          echo "Aplicação : $APP_NAME"
          echo "Commit    : $GITHUB_SHA"
          echo "Branch    : $GITHUB_REF_NAME"
          echo "Usuário   : $ZOS_USER"

          echo
          echo "Alterados   : ${CHANGED_COUNT:-N/A}"
          echo "Removidos   : ${DELETED_COUNT:-N/A}"
          echo "Build files : ${BUILD_FILE_COUNT:-N/A}"

          echo
          echo "Build     : ${BUILD_TYPE:-N/A}"
          echo "Motivo    : ${BUILD_REASON:-N/A}"

          echo "=========================================="