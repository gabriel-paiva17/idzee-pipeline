name: IDzEE Smart Build

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      build_type:
        description: "Tipo de build"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - impact
          - full

jobs:

  build:

    runs-on:
      - self-hosted
      - Linux
      - ARM64

    env:
      ZOS_HOST: ${{ secrets.ZOS_HOST }}
      ZOS_PORT: ${{ secrets.ZOS_PORT }}
      ZOS_USER: ${{ secrets.ZOS_USER }}
      ZOS_PASSWORD: ${{ secrets.ZOS_PASSWORD }}

      APP_NAME: idzee-pipeline


    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2


      # ============================================================
      # 2. VERIFICAR RUNNER
      # ============================================================

      - name: Verificar ambiente
        shell: bash
        run: |
          echo "=========================================="
          echo "AMBIENTE DO RUNNER"
          echo "=========================================="

          echo "Hostname:"
          hostname

          echo
          echo "Node:"
          node --version

          echo
          echo "Zowe:"
          zowe --version


      # ============================================================
      # 3. DEFINIR AMBIENTE
      # ============================================================

      - name: Definir ambiente DBB
        shell: bash
        run: |
          USS_USER="${ZOS_USER,,}"
          DBB_HLQ="${ZOS_USER}.DBB"
          DBB_ROOT="/u/${USS_USER}/dbb"

          echo "USS_USER=$USS_USER" >> "$GITHUB_ENV"
          echo "DBB_HLQ=$DBB_HLQ" >> "$GITHUB_ENV"
          echo "DBB_ROOT=$DBB_ROOT" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "AMBIENTE DBB"
          echo "=========================================="
          echo "USS_USER : $USS_USER"
          echo "DBB_HLQ  : $DBB_HLQ"
          echo "DBB_ROOT : $DBB_ROOT"


      # ============================================================
      # 4. ANALISAR ALTERAÇÕES NO RUNNER
      # ============================================================

      - name: Analisar alterações
        shell: bash
        run: |
          echo "=========================================="
          echo "ANÁLISE DAS ALTERAÇÕES"
          echo "=========================================="

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            REQUESTED_BUILD="${{ github.event.inputs.build_type }}"
          else
            REQUESTED_BUILD="auto"
          fi

          echo "Modo solicitado: $REQUESTED_BUILD"

          # --------------------------------------------------------
          # Descobrir alterações do commit
          # --------------------------------------------------------

          if git rev-parse HEAD^ >/dev/null 2>&1; then

            git diff \
              --name-only \
              --diff-filter=ACMR \
              HEAD^ HEAD \
              > changed-files.txt

            git diff \
              --name-only \
              --diff-filter=D \
              HEAD^ HEAD \
              > deleted-files.txt

          else

            git ls-files > changed-files.txt
            : > deleted-files.txt

          fi


          echo
          echo "Arquivos adicionados/modificados:"
          echo "------------------------------------------"
          cat changed-files.txt || true
          echo "------------------------------------------"

          echo
          echo "Arquivos removidos:"
          echo "------------------------------------------"
          cat deleted-files.txt || true
          echo "------------------------------------------"


          # --------------------------------------------------------
          # Arquivos relevantes ao build
          # --------------------------------------------------------

          grep -Ei '\.(cbl|cbcw|cpy|bms|lnk)$' \
            changed-files.txt \
            > changed-build-files.txt || true

          grep -Ei '\.(cbl|cbcw|cpy|bms|lnk)$' \
            deleted-files.txt \
            > deleted-build-files.txt || true


          CHANGED_COUNT=$(wc -l < changed-files.txt | tr -d ' ')
          DELETED_COUNT=$(wc -l < deleted-files.txt | tr -d ' ')

          CHANGED_BUILD_COUNT=$(wc -l < changed-build-files.txt | tr -d ' ')
          DELETED_BUILD_COUNT=$(wc -l < deleted-build-files.txt | tr -d ' ')

          RELEVANT_COUNT=$((CHANGED_BUILD_COUNT + DELETED_BUILD_COUNT))


          # --------------------------------------------------------
          # Configuração DBB
          # --------------------------------------------------------

          CONFIG_CHANGED=false

          if grep -Eq \
            '(^|/)(dbb-app\.yaml|dbb-build\.yaml)$' \
            changed-files.txt; then
            CONFIG_CHANGED=true
          fi

          if grep -Eq \
            '(^|/)(dbb-app\.yaml|dbb-build\.yaml)$' \
            deleted-files.txt; then
            CONFIG_CHANGED=true
          fi


          # --------------------------------------------------------
          # Decisão
          # --------------------------------------------------------

          BUILD_TYPE="$REQUESTED_BUILD"
          BUILD_REASON="Execução manual: $REQUESTED_BUILD"


          if [[ "$BUILD_TYPE" == "auto" ]]; then

            if [[ "$CONFIG_CHANGED" == "true" ]]; then

              BUILD_TYPE="full"
              BUILD_REASON="Configuração DBB alterada"

            elif [[ "$RELEVANT_COUNT" -gt 0 ]]; then

              BUILD_TYPE="impact"
              BUILD_REASON="${RELEVANT_COUNT} alteração(ões) relevante(s) para DBB"

            else

              BUILD_TYPE="none"
              BUILD_REASON="Nenhuma alteração relevante para build"

            fi

          fi


          echo
          echo "=========================================="
          echo "RESULTADO DA ANÁLISE"
          echo "=========================================="
          echo "Alterados            : $CHANGED_COUNT"
          echo "Removidos            : $DELETED_COUNT"
          echo "Alterados DBB        : $CHANGED_BUILD_COUNT"
          echo "Removidos DBB        : $DELETED_BUILD_COUNT"
          echo "Relevantes DBB       : $RELEVANT_COUNT"
          echo "Config DBB alterada  : $CONFIG_CHANGED"
          echo
          echo "Build                : $BUILD_TYPE"
          echo "Motivo               : $BUILD_REASON"
          echo "=========================================="


          echo "BUILD_TYPE=$BUILD_TYPE" >> "$GITHUB_ENV"
          echo "BUILD_REASON=$BUILD_REASON" >> "$GITHUB_ENV"

          echo "CHANGED_COUNT=$CHANGED_COUNT" >> "$GITHUB_ENV"
          echo "DELETED_COUNT=$DELETED_COUNT" >> "$GITHUB_ENV"
          echo "CHANGED_BUILD_COUNT=$CHANGED_BUILD_COUNT" >> "$GITHUB_ENV"
          echo "DELETED_BUILD_COUNT=$DELETED_BUILD_COUNT" >> "$GITHUB_ENV"
          echo "RELEVANT_COUNT=$RELEVANT_COUNT" >> "$GITHUB_ENV"


      # ============================================================
      # 5. VERIFICAR BASELINE GIT NO USS
      #
      # Não basta .git existir.
      # HEAD precisa apontar para um commit válido.
      # ============================================================

      - name: Verificar baseline Git no USS
        if: env.BUILD_TYPE != 'none'
        shell: bash
        run: |
          echo "=========================================="
          echo "VERIFICANDO BASELINE GIT NO USS"
          echo "=========================================="

          set +e

          RESULT=$(zowe rse-api-for-zowe-cli issue unix-shell \
            --cwd "${DBB_ROOT}/${APP_NAME}" \
            "git rev-parse --verify HEAD 2>/dev/null" \
            --host "$ZOS_HOST" \
            --port "$ZOS_PORT" \
            --user "$ZOS_USER" \
            --password "$ZOS_PASSWORD" 2>&1)

          RC=$?

          set -e

          echo "Retorno do USS:"
          echo "$RESULT"
          echo
          echo "RC do comando: $RC"

          if [[ "$RC" -eq 0 ]] && \
             echo "$RESULT" | grep -Eq '[0-9a-fA-F]{7,40}'; then

            echo
            echo "Baseline Git encontrado."

            echo "BASELINE_EXISTS=true" >> "$GITHUB_ENV"

          else

            echo
            echo "Baseline Git não encontrado."
            echo "A execução será convertida para Full Build."

            echo "BASELINE_EXISTS=false" >> "$GITHUB_ENV"
            echo "BUILD_TYPE=full" >> "$GITHUB_ENV"
            echo "BUILD_REASON=Baseline Git inexistente - Full Build inicial" >> "$GITHUB_ENV"

          fi


      # ============================================================
      # 6. PLANO
      # ============================================================

      - name: Plano de execução
        shell: bash
        run: |
          echo "=========================================="
          echo "IDzEE SMART BUILD"
          echo "=========================================="

          echo "Aplicação : $APP_NAME"
          echo "Usuário   : $ZOS_USER"
          echo "HLQ       : $DBB_HLQ"
          echo "USS       : $DBB_ROOT/$APP_NAME"

          echo
          echo "Alterados      : ${CHANGED_COUNT:-0}"
          echo "Removidos      : ${DELETED_COUNT:-0}"
          echo "Relevantes DBB : ${RELEVANT_COUNT:-0}"

          echo
          echo "Build  : $BUILD_TYPE"
          echo "Motivo : $BUILD_REASON"

          echo "=========================================="


      # ============================================================
      # 7. CONFIGURAR UPLOAD
      # ============================================================

      - name: Configurar upload
        if: env.BUILD_TYPE != 'none'
        shell: bash
        run: |
          cat > .zosattributes <<'EOF'
          .git/        -
          .github/     -
          .DS_Store    -
          EOF

          echo "Arquivo .zosattributes criado."


      # ============================================================
      # 8. PREPARAR WORKSPACE
      # ============================================================

      - name: Preparar workspace no z/OS
        if: env.BUILD_TYPE != 'none'
        shell: bash
        run: |
          echo "=========================================="
          echo "PREPARANDO WORKSPACE USS"
          echo "=========================================="

          RESULT=$(zowe rse-api-for-zowe-cli issue unix-shell \
            --cwd "/u" \
            "mkdir -p '${DBB_ROOT}/logs' '${DBB_ROOT}/${APP_NAME}' && pwd" \
            --host "$ZOS_HOST" \
            --port "$ZOS_PORT" \
            --user "$ZOS_USER" \
            --password "$ZOS_PASSWORD")

          echo "Retorno do USS:"
          echo "$RESULT"


      # ============================================================
      # 9A. FULL UPLOAD
      # ============================================================

      - name: Upload completo para o z/OS
        if: env.BUILD_TYPE == 'full'
        shell: bash
        run: |
          echo "=========================================="
          echo "FULL UPLOAD"
          echo "=========================================="

          zowe rse-api-for-zowe-cli upload dir-to-uss \
            "." \
            "${DBB_ROOT}/${APP_NAME}" \
            --recursive \
            --attributes .zosattributes \
            --max-concurrent-requests 5 \
            --host "$ZOS_HOST" \
            --port "$ZOS_PORT" \
            --user "$ZOS_USER" \
            --password "$ZOS_PASSWORD"

          echo
          echo "Upload completo finalizado."


      # ============================================================
      # 9B. IMPACT UPLOAD
      # ============================================================

      - name: Upload incremental para o z/OS
        if: env.BUILD_TYPE == 'impact'
        shell: bash
        run: |
          echo "=========================================="
          echo "IMPACT - UPLOAD INCREMENTAL"
          echo "=========================================="

          while IFS= read -r FILE
          do
            [[ -z "$FILE" ]] && continue

            LOCAL_FILE="$FILE"
            REMOTE_FILE="${DBB_ROOT}/${APP_NAME}/${FILE}"
            REMOTE_DIR=$(dirname "$REMOTE_FILE")

            echo
            echo "Arquivo : $FILE"
            echo "Destino : $REMOTE_FILE"

            RESULT=$(zowe rse-api-for-zowe-cli issue unix-shell \
              --cwd "${DBB_ROOT}/${APP_NAME}" \
              "mkdir -p '${REMOTE_DIR}'" \
              --host "$ZOS_HOST" \
              --port "$ZOS_PORT" \
              --user "$ZOS_USER" \
              --password "$ZOS_PASSWORD")

            echo "$RESULT"

            zowe rse-api-for-zowe-cli upload file-to-uss \
              "$LOCAL_FILE" \
              "$REMOTE_FILE" \
              --host "$ZOS_HOST" \
              --port "$ZOS_PORT" \
              --user "$ZOS_USER" \
              --password "$ZOS_PASSWORD"

          done < changed-files.txt

          echo
          echo "Upload incremental finalizado."


      # ============================================================
      # 10. SINCRONIZAR DELEÇÕES
      # ============================================================

      - name: Remover arquivos deletados do USS
        if: env.BUILD_TYPE != 'none' && env.DELETED_COUNT != '0'
        shell: bash
        run: |
          echo "=========================================="
          echo "SINCRONIZANDO DELEÇÕES"
          echo "=========================================="

          while IFS= read -r FILE
          do
            [[ -z "$FILE" ]] && continue

            REMOTE_FILE="${DBB_ROOT}/${APP_NAME}/${FILE}"

            echo "Removendo do USS: $FILE"

            RESULT=$(zowe rse-api-for-zowe-cli issue unix-shell \
              --cwd "${DBB_ROOT}/${APP_NAME}" \
              "rm -f '${REMOTE_FILE}'" \
              --host "$ZOS_HOST" \
              --port "$ZOS_PORT" \
              --user "$ZOS_USER" \
              --password "$ZOS_PASSWORD")

            echo "$RESULT"

          done < deleted-files.txt


      # ============================================================
      # 11. ATUALIZAR GIT LOCAL DO USS
      #
      # Sem || true no git commit.
      # Primeiro verificamos se há algo para commitar.
      # ============================================================

      - name: Atualizar Git local no USS
        if: env.BUILD_TYPE != 'none'
        shell: bash
        run: |
          echo "=========================================="
          echo "ATUALIZANDO GIT LOCAL DO USS"
          echo "=========================================="

          RESULT=$(zowe rse-api-for-zowe-cli issue unix-shell \
            --cwd "${DBB_ROOT}/${APP_NAME}" \
            ". ~/.profile && \
             if [ ! -d .git ]; then \
               git init; \
             fi && \
             git add -A && \
             if git diff --cached --quiet; then \
               exit 0; \
             fi && \
             git -c user.name='IDzEE Pipeline' \
                 -c user.email='idzee-pipeline@local' \
                 commit -m 'GitHub ${GITHUB_SHA}'" \
            --host "$ZOS_HOST" \
            --port "$ZOS_PORT" \
            --user "$ZOS_USER" \
            --password "$ZOS_PASSWORD")

          echo "Retorno do USS:"
          echo "$RESULT"


      # ============================================================
      # 12. CONSULTAR ESTADO DO GIT
      #
      # Os comandos rodam no USS.
      # A resposta é capturada e impressa pelo runner.
      # ============================================================

      - name: Verificar Git no USS
        if: env.BUILD_TYPE != 'none'
        shell: bash
        run: |
          echo "=========================================="
          echo "ESTADO DO GIT NO USS"
          echo "=========================================="

          echo
          echo "HEAD atual:"

          RESULT=$(zowe rse-api-for-zowe-cli issue unix-shell \
            --cwd "${DBB_ROOT}/${APP_NAME}" \
            "git rev-parse HEAD" \
            --host "$ZOS_HOST" \
            --port "$ZOS_PORT" \
            --user "$ZOS_USER" \
            --password "$ZOS_PASSWORD")

          echo "$RESULT"


          echo
          echo "Últimos commits:"

          RESULT=$(zowe rse-api-for-zowe-cli issue unix-shell \
            --cwd "${DBB_ROOT}/${APP_NAME}" \
            "git log --oneline -5" \
            --host "$ZOS_HOST" \
            --port "$ZOS_PORT" \
            --user "$ZOS_USER" \
            --password "$ZOS_PASSWORD")

          echo "$RESULT"


          echo
          echo "Git status:"

          RESULT=$(zowe rse-api-for-zowe-cli issue unix-shell \
            --cwd "${DBB_ROOT}/${APP_NAME}" \
            "git status --short" \
            --host "$ZOS_HOST" \
            --port "$ZOS_PORT" \
            --user "$ZOS_USER" \
            --password "$ZOS_PASSWORD")

          echo "$RESULT"


      # ============================================================
      # 13. VERIFICAR WORKSPACE
      # ============================================================

      - name: Verificar workspace no USS
        if: env.BUILD_TYPE != 'none'
        shell: bash
        run: |
          echo "=========================================="
          echo "VERIFICANDO WORKSPACE"
          echo "=========================================="

          RESULT=$(zowe rse-api-for-zowe-cli issue unix-shell \
            --cwd "${DBB_ROOT}/${APP_NAME}" \
            "pwd; \
             test -f dbb-app.yaml; \
             ls -la | head -30" \
            --host "$ZOS_HOST" \
            --port "$ZOS_PORT" \
            --user "$ZOS_USER" \
            --password "$ZOS_PASSWORD")

          echo "$RESULT"


      # ============================================================
      # 14. FULL BUILD
      # ============================================================

      - name: Executar DBB Full Build
        if: env.BUILD_TYPE == 'full'
        shell: bash
        run: |
          echo "=========================================="
          echo "DBB FULL BUILD"
          echo "=========================================="
          echo "Motivo: $BUILD_REASON"
          echo "=========================================="

          RESULT=$(zowe rse-api-for-zowe-cli issue unix-shell \
            --cwd "${DBB_ROOT}/${APP_NAME}" \
            ". ~/.profile && \
             \$DBB_HOME/bin/dbb build full \
             --hlq ${DBB_HLQ}" \
            --host "$ZOS_HOST" \
            --port "$ZOS_PORT" \
            --user "$ZOS_USER" \
            --password "$ZOS_PASSWORD")

          echo "$RESULT"


      # ============================================================
      # 15. IMPACT BUILD
      # ============================================================

      - name: Executar DBB Impact Build
        if: env.BUILD_TYPE == 'impact'
        shell: bash
        run: |
          echo "=========================================="
          echo "DBB IMPACT BUILD"
          echo "=========================================="
          echo "Motivo: $BUILD_REASON"
          echo "=========================================="

          RESULT=$(zowe rse-api-for-zowe-cli issue unix-shell \
            --cwd "${DBB_ROOT}/${APP_NAME}" \
            ". ~/.profile && \
             \$DBB_HOME/bin/dbb build impact \
             --hlq ${DBB_HLQ}" \
            --host "$ZOS_HOST" \
            --port "$ZOS_PORT" \
            --user "$ZOS_USER" \
            --password "$ZOS_PASSWORD")

          echo "$RESULT"


      # ============================================================
      # 16. NENHUM BUILD
      # ============================================================

      - name: Nenhum build necessário
        if: env.BUILD_TYPE == 'none'
        shell: bash
        run: |
          echo "=========================================="
          echo "BUILD IGNORADO"
          echo "=========================================="
          echo "$BUILD_REASON"
          echo "=========================================="


      # ============================================================
      # 17. RESUMO
      # ============================================================

      - name: Resumo da execução
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "RESUMO - IDzEE SMART BUILD"
          echo "=========================================="

          echo "Aplicação : $APP_NAME"
          echo "Commit    : $GITHUB_SHA"
          echo "Branch    : $GITHUB_REF_NAME"
          echo "Usuário   : $ZOS_USER"

          echo
          echo "Alterados      : ${CHANGED_COUNT:-N/A}"
          echo "Removidos      : ${DELETED_COUNT:-N/A}"
          echo "Relevantes DBB : ${RELEVANT_COUNT:-N/A}"

          echo
          echo "Build  : ${BUILD_TYPE:-N/A}"
          echo "Motivo : ${BUILD_REASON:-N/A}"

          echo "=========================================="