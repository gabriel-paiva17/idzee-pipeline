name: IDzEE Smart Build

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      build_type:
        description: "Tipo de build"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - impact
          - full

jobs:

  build:

    runs-on:
      - self-hosted
      - Linux
      - ARM64

    env:

      ZOS_HOST: ${{ secrets.ZOS_HOST }}
      ZOS_PORT: ${{ secrets.ZOS_PORT }}
      ZOS_USER: ${{ secrets.ZOS_USER }}
      ZOS_PASSWORD: ${{ secrets.ZOS_PASSWORD }}

      APP_NAME: idzee-pipeline


    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2


      # ============================================================
      # 2. VERIFICAR RUNNER
      # ============================================================

      - name: Verificar ambiente
        shell: bash
        run: |

          echo "=========================================="
          echo "AMBIENTE DO RUNNER"
          echo "=========================================="

          hostname
          node --version
          zowe --version


      # ============================================================
      # 3. DEFINIR AMBIENTE DBB
      # ============================================================

      - name: Definir ambiente DBB
        shell: bash
        run: |

          USS_USER="${ZOS_USER,,}"
          DBB_HLQ="${ZOS_USER}.DBB"
          DBB_ROOT="/u/${USS_USER}/dbb"

          echo "USS_USER=$USS_USER" >> "$GITHUB_ENV"
          echo "DBB_HLQ=$DBB_HLQ" >> "$GITHUB_ENV"
          echo "DBB_ROOT=$DBB_ROOT" >> "$GITHUB_ENV"


      # ============================================================
      # 4. ANALISAR ALTERAÇÕES
      # ============================================================

      - name: Analisar alterações
        shell: bash
        run: |

          echo "=========================================="
          echo "ANÁLISE DAS ALTERAÇÕES"
          echo "=========================================="


          # --------------------------------------------------------
          # Build solicitado
          # --------------------------------------------------------

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            REQUESTED_BUILD="${{ github.event.inputs.build_type }}"
          else
            REQUESTED_BUILD="auto"
          fi

          echo "Modo solicitado: $REQUESTED_BUILD"


          # --------------------------------------------------------
          # Identificar arquivos alterados
          # --------------------------------------------------------

          if git rev-parse HEAD^ >/dev/null 2>&1; then

            git diff \
              --name-only \
              --diff-filter=ACMR \
              HEAD^ HEAD \
              > changed-files.txt

            git diff \
              --name-only \
              --diff-filter=D \
              HEAD^ HEAD \
              > deleted-files.txt

          else

            git ls-files > changed-files.txt
            : > deleted-files.txt

          fi


          echo
          echo "Arquivos adicionados/modificados:"
          echo "------------------------------------------"
          cat changed-files.txt || true
          echo "------------------------------------------"

          echo
          echo "Arquivos removidos:"
          echo "------------------------------------------"
          cat deleted-files.txt || true
          echo "------------------------------------------"


          # --------------------------------------------------------
          # Arquivos relevantes para build
          #
          # Esses arquivos justificam Impact Build.
          # --------------------------------------------------------

          grep -Ei '\.(cbl|cbcw|cpy|bms|lnk)$' \
            changed-files.txt \
            > changed-build-files.txt || true

          grep -Ei '\.(cbl|cbcw|cpy|bms|lnk)$' \
            deleted-files.txt \
            > deleted-build-files.txt || true


          # --------------------------------------------------------
          # Contadores
          # --------------------------------------------------------

          CHANGED_COUNT=$(wc -l < changed-files.txt | tr -d ' ')
          DELETED_COUNT=$(wc -l < deleted-files.txt | tr -d ' ')

          CHANGED_BUILD_COUNT=$(wc -l < changed-build-files.txt | tr -d ' ')
          DELETED_BUILD_COUNT=$(wc -l < deleted-build-files.txt | tr -d ' ')

          RELEVANT_COUNT=$((CHANGED_BUILD_COUNT + DELETED_BUILD_COUNT))


          echo
          echo "Arquivos alterados        : $CHANGED_COUNT"
          echo "Arquivos removidos        : $DELETED_COUNT"
          echo "Alterações relevantes DBB : $RELEVANT_COUNT"


          # --------------------------------------------------------
          # Verificar alteração de configuração DBB
          # --------------------------------------------------------

          CONFIG_CHANGED=false

          if grep -Eq \
            '(^|/)(dbb-app\.yaml|dbb-build\.yaml)$' \
            changed-files.txt; then

            CONFIG_CHANGED=true

          fi


          # Também considera remoção de configuração
          if grep -Eq \
            '(^|/)(dbb-app\.yaml|dbb-build\.yaml)$' \
            deleted-files.txt; then

            CONFIG_CHANGED=true

          fi


          echo "Configuração DBB alterada : $CONFIG_CHANGED"


          # ========================================================
          # DECISÃO
          # ========================================================

          BUILD_TYPE="$REQUESTED_BUILD"
          BUILD_REASON=""


          if [[ "$BUILD_TYPE" == "auto" ]]; then

            # ------------------------------------------------------
            # Configuração DBB alterada
            # ------------------------------------------------------

            if [[ "$CONFIG_CHANGED" == "true" ]]; then

              BUILD_TYPE="full"
              BUILD_REASON="Configuração DBB alterada"


            # ------------------------------------------------------
            # Fonte ou dependência alterado/removido
            # ------------------------------------------------------

            elif [[ "$RELEVANT_COUNT" -gt 0 ]]; then

              BUILD_TYPE="impact"
              BUILD_REASON="${RELEVANT_COUNT} alteração(ões) relevante(s) para o build"


            # ------------------------------------------------------
            # Nenhuma alteração relevante
            # ------------------------------------------------------

            else

              BUILD_TYPE="none"
              BUILD_REASON="Nenhuma alteração relevante para build"

            fi

          fi


          echo
          echo "=========================================="
          echo "DECISÃO"
          echo "=========================================="
          echo "Build  : $BUILD_TYPE"
          echo "Motivo : $BUILD_REASON"
          echo "=========================================="


          echo "BUILD_TYPE=$BUILD_TYPE" >> "$GITHUB_ENV"
          echo "BUILD_REASON=$BUILD_REASON" >> "$GITHUB_ENV"

          echo "CHANGED_COUNT=$CHANGED_COUNT" >> "$GITHUB_ENV"
          echo "DELETED_COUNT=$DELETED_COUNT" >> "$GITHUB_ENV"
          echo "CHANGED_BUILD_COUNT=$CHANGED_BUILD_COUNT" >> "$GITHUB_ENV"
          echo "DELETED_BUILD_COUNT=$DELETED_BUILD_COUNT" >> "$GITHUB_ENV"
          echo "RELEVANT_COUNT=$RELEVANT_COUNT" >> "$GITHUB_ENV"


      # ============================================================
      # 5. VERIFICAR BASELINE NO USS
      #
      # Impact Build depende de histórico Git.
      # Se ainda não existir Git no workspace, fazemos Full.
      # ============================================================

      - name: Verificar baseline no USS
        if: env.BUILD_TYPE != 'none'
        shell: bash
        run: |

          echo "=========================================="
          echo "VERIFICANDO BASELINE"
          echo "=========================================="

          RESULT=$(zowe rse-api-for-zowe-cli issue unix-shell \
            --cwd "/u" \
            "if [ -d '${DBB_ROOT}/${APP_NAME}/.git' ]; then \
               echo BASELINE_EXISTS; \
             else \
               echo BASELINE_MISSING; \
             fi" \
            --host "$ZOS_HOST" \
            --port "$ZOS_PORT" \
            --user "$ZOS_USER" \
            --password "$ZOS_PASSWORD")

          echo "$RESULT"


          if echo "$RESULT" | grep -q "BASELINE_EXISTS"; then

            echo "BASELINE_EXISTS=true" >> "$GITHUB_ENV"

          else

            echo "BASELINE_EXISTS=false" >> "$GITHUB_ENV"

            echo
            echo "Baseline Git inexistente."
            echo "Forçando Full Build inicial."

            echo "BUILD_TYPE=full" >> "$GITHUB_ENV"
            echo "BUILD_REASON=Baseline Git inexistente - Full Build inicial" >> "$GITHUB_ENV"

          fi


      # ============================================================
      # 6. PLANO DE EXECUÇÃO
      # ============================================================

      - name: Plano de execução
        shell: bash
        run: |

          echo "=========================================="
          echo "IDzEE SMART BUILD"
          echo "=========================================="

          echo "Aplicação : $APP_NAME"
          echo "Usuário   : $ZOS_USER"
          echo "HLQ       : $DBB_HLQ"
          echo "USS       : $DBB_ROOT/$APP_NAME"

          echo
          echo "Alterados        : $CHANGED_COUNT"
          echo "Removidos        : $DELETED_COUNT"
          echo "Relevantes DBB   : $RELEVANT_COUNT"

          echo
          echo "Build  : $BUILD_TYPE"
          echo "Motivo : $BUILD_REASON"

          echo "=========================================="


      # ============================================================
      # 7. CONFIGURAR UPLOAD
      #
      # O .git do runner NÃO é enviado.
      # O Git do USS é próprio e persistente.
      # ============================================================

      - name: Configurar upload
        if: env.BUILD_TYPE != 'none'
        shell: bash
        run: |

          cat > .zosattributes <<'EOF'
          .git/        -
          .github/     -
          .DS_Store    -
          EOF


      # ============================================================
      # 8. PREPARAR WORKSPACE USS
      #
      # Não removemos mais o diretório da aplicação.
      # Precisamos preservar .git.
      # ============================================================

      - name: Preparar workspace no z/OS
        if: env.BUILD_TYPE != 'none'
        shell: bash
        run: |

          echo "=========================================="
          echo "PREPARANDO WORKSPACE USS"
          echo "=========================================="

          zowe rse-api-for-zowe-cli issue unix-shell \
            --cwd "/u" \
            "mkdir -p '${DBB_ROOT}/logs' && \
             mkdir -p '${DBB_ROOT}/${APP_NAME}'" \
            --host "$ZOS_HOST" \
            --port "$ZOS_PORT" \
            --user "$ZOS_USER" \
            --password "$ZOS_PASSWORD"


      # ============================================================
      # 9A. FULL UPLOAD
      #
      # Para Full Build sincronizamos o repositório completo.
      # ============================================================

      - name: Upload completo para o z/OS
        if: env.BUILD_TYPE == 'full'
        shell: bash
        run: |

          echo "=========================================="
          echo "FULL UPLOAD"
          echo "=========================================="

          zowe rse-api-for-zowe-cli upload dir-to-uss \
            "." \
            "${DBB_ROOT}/${APP_NAME}" \
            --recursive \
            --attributes .zosattributes \
            --max-concurrent-requests 5 \
            --host "$ZOS_HOST" \
            --port "$ZOS_PORT" \
            --user "$ZOS_USER" \
            --password "$ZOS_PASSWORD"


      # ============================================================
      # 9B. IMPACT UPLOAD
      #
      # No Impact Build enviamos somente arquivos alterados.
      # ============================================================

      - name: Upload incremental para o z/OS
        if: env.BUILD_TYPE == 'impact'
        shell: bash
        run: |

          echo "=========================================="
          echo "IMPACT - UPLOAD INCREMENTAL"
          echo "=========================================="

          while IFS= read -r FILE
          do

            [[ -z "$FILE" ]] && continue

            LOCAL_FILE="$FILE"
            REMOTE_FILE="${DBB_ROOT}/${APP_NAME}/${FILE}"
            REMOTE_DIR=$(dirname "$REMOTE_FILE")

            echo "Sincronizando: $FILE"

            zowe rse-api-for-zowe-cli issue unix-shell \
              --cwd "${DBB_ROOT}/${APP_NAME}" \
              "mkdir -p '${REMOTE_DIR}'" \
              --host "$ZOS_HOST" \
              --port "$ZOS_PORT" \
              --user "$ZOS_USER" \
              --password "$ZOS_PASSWORD"

            zowe rse-api-for-zowe-cli upload file-to-uss \
              "$LOCAL_FILE" \
              "$REMOTE_FILE" \
              --host "$ZOS_HOST" \
              --port "$ZOS_PORT" \
              --user "$ZOS_USER" \
              --password "$ZOS_PASSWORD"

          done < changed-files.txt


      # ============================================================
      # 10. SINCRONIZAR DELEÇÕES
      #
      # O arquivo precisa desaparecer do USS antes do commit.
      # Assim o Git local registra a deleção.
      # ============================================================

      - name: Remover arquivos deletados do USS
        if: env.BUILD_TYPE != 'none' && env.DELETED_COUNT != '0'
        shell: bash
        run: |

          echo "=========================================="
          echo "SINCRONIZANDO DELEÇÕES"
          echo "=========================================="

          while IFS= read -r FILE
          do

            [[ -z "$FILE" ]] && continue

            REMOTE_FILE="${DBB_ROOT}/${APP_NAME}/${FILE}"

            echo "Removendo: $FILE"

            zowe rse-api-for-zowe-cli issue unix-shell \
              --cwd "${DBB_ROOT}/${APP_NAME}" \
              "rm -f '${REMOTE_FILE}'" \
              --host "$ZOS_HOST" \
              --port "$ZOS_PORT" \
              --user "$ZOS_USER" \
              --password "$ZOS_PASSWORD"

          done < deleted-files.txt


      # ============================================================
      # 11. ATUALIZAR GIT LOCAL DO USS
      #
      # Primeira execução:
      #
      #   git init
      #   git add -A
      #   git commit
      #
      # Próximas execuções:
      #
      #   git add -A
      #   git commit
      #
      # O .git nunca é removido.
      # ============================================================

      - name: Atualizar Git local no USS
        if: env.BUILD_TYPE != 'none'
        shell: bash
        run: |

          echo "=========================================="
          echo "ATUALIZANDO GIT LOCAL DO USS"
          echo "=========================================="

          zowe rse-api-for-zowe-cli issue unix-shell \
            --cwd "${DBB_ROOT}/${APP_NAME}" \
            ". ~/.profile && \
             if [ ! -d .git ]; then \
               echo 'Inicializando Git local'; \
               git init; \
             fi && \
             git add -A && \
             git -c user.name='IDzEE Pipeline' \
                 -c user.email='idzee-pipeline@local' \
                 commit -m 'GitHub ${GITHUB_SHA}' || true && \
             echo && \
             echo 'Últimos commits:' && \
             git log --oneline -5" \
            --host "$ZOS_HOST" \
            --port "$ZOS_PORT" \
            --user "$ZOS_USER" \
            --password "$ZOS_PASSWORD"


      # ============================================================
      # 12. VERIFICAR WORKSPACE
      # ============================================================

      - name: Verificar workspace no USS
        if: env.BUILD_TYPE != 'none'
        shell: bash
        run: |

          echo "=========================================="
          echo "WORKSPACE USS"
          echo "=========================================="

          zowe rse-api-for-zowe-cli issue unix-shell \
            --cwd "${DBB_ROOT}/${APP_NAME}" \
            "pwd && \
             echo && \
             git status && \
             echo && \
             git log --oneline -3 && \
             echo && \
             test -f dbb-app.yaml && \
             echo 'dbb-app.yaml encontrado'" \
            --host "$ZOS_HOST" \
            --port "$ZOS_PORT" \
            --user "$ZOS_USER" \
            --password "$ZOS_PASSWORD"


      # ============================================================
      # 13. FULL BUILD
      #
      # Utilizado para:
      #
      # - Primeiro build
      # - Configuração DBB alterada
      # - Execução manual Full
      #
      # Também popula o Metadata Store e estabelece o baseline.
      # ============================================================

      - name: Executar DBB Full Build
        if: env.BUILD_TYPE == 'full'
        shell: bash
        run: |

          echo "=========================================="
          echo "DBB FULL BUILD"
          echo "=========================================="
          echo "Motivo: $BUILD_REASON"
          echo "=========================================="

          zowe rse-api-for-zowe-cli issue unix-shell \
            --cwd "${DBB_ROOT}/${APP_NAME}" \
            ". ~/.profile && \
             \$DBB_HOME/bin/dbb build full \
             --hlq ${DBB_HLQ}" \
            --host "$ZOS_HOST" \
            --port "$ZOS_PORT" \
            --user "$ZOS_USER" \
            --password "$ZOS_PASSWORD"


      # ============================================================
      # 14. IMPACT BUILD
      #
      # Fluxo padrão da Smart Pipeline.
      #
      # O DBB:
      #
      # 1. compara Git baseline x Git atual
      # 2. identifica changed/deleted/renamed
      # 3. consulta Metadata Store
      # 4. identifica programas impactados
      # 5. monta SOURCE_LIST
      # 6. compila somente o necessário
      #
      # Não precisamos informar --baselineRef.
      # ============================================================

      - name: Executar DBB Impact Build
        if: env.BUILD_TYPE == 'impact'
        shell: bash
        run: |

          echo "=========================================="
          echo "DBB IMPACT BUILD"
          echo "=========================================="
          echo "Motivo: $BUILD_REASON"
          echo "=========================================="

          zowe rse-api-for-zowe-cli issue unix-shell \
            --cwd "${DBB_ROOT}/${APP_NAME}" \
            ". ~/.profile && \
             \$DBB_HOME/bin/dbb build impact \
             --hlq ${DBB_HLQ}" \
            --host "$ZOS_HOST" \
            --port "$ZOS_PORT" \
            --user "$ZOS_USER" \
            --password "$ZOS_PASSWORD"


      # ============================================================
      # 15. NENHUM BUILD
      # ============================================================

      - name: Nenhum build necessário
        if: env.BUILD_TYPE == 'none'
        shell: bash
        run: |

          echo "=========================================="
          echo "BUILD IGNORADO"
          echo "=========================================="
          echo "$BUILD_REASON"
          echo "=========================================="


      # ============================================================
      # 16. RESUMO
      # ============================================================

      - name: Resumo da execução
        if: always()
        shell: bash
        run: |

          echo "=========================================="
          echo "RESUMO - IDzEE SMART BUILD"
          echo "=========================================="

          echo "Aplicação : $APP_NAME"
          echo "Commit    : $GITHUB_SHA"
          echo "Branch    : $GITHUB_REF_NAME"
          echo "Usuário   : $ZOS_USER"

          echo
          echo "Alterados      : ${CHANGED_COUNT:-N/A}"
          echo "Removidos      : ${DELETED_COUNT:-N/A}"
          echo "Relevantes DBB : ${RELEVANT_COUNT:-N/A}"

          echo
          echo "Build  : ${BUILD_TYPE:-N/A}"
          echo "Motivo : ${BUILD_REASON:-N/A}"

          echo "=========================================="