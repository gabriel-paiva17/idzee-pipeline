name: IDzEE Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on:
      - self-hosted
      - Linux
      - ARM64

    env:
      ZOS_HOST: ${{ secrets.ZOS_HOST }}
      ZOS_PORT: ${{ secrets.ZOS_PORT }}
      ZOS_USER: ${{ secrets.ZOS_USER }}
      ZOS_PASSWORD: ${{ secrets.ZOS_PASSWORD }}

      APP_NAME: idzee-pipeline
      REPO_URL: https://github.com/gabriel-paiva17/idzee-pipeline.git

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar ambiente
        run: |
          hostname
          node --version
          zowe --version

      - name: Definir ambiente DBB
        run: |
          echo "USS_USER=${ZOS_USER,,}" >> "$GITHUB_ENV"
          echo "DBB_HLQ=${ZOS_USER}.DBB" >> "$GITHUB_ENV"
          echo "DBB_ROOT=/u/${ZOS_USER,,}/dbb" >> "$GITHUB_ENV"

      - name: Preparar workspace no z/OS
        run: |
          zowe rse-api-for-zowe-cli issue unix-shell \
            --cwd "/u" \
            "mkdir -p ${DBB_ROOT}/logs && \
             rm -rf ${DBB_ROOT}/${APP_NAME}" \
            --host "$ZOS_HOST" \
            --port "$ZOS_PORT" \
            --user "$ZOS_USER" \
            --password "$ZOS_PASSWORD"

      - name: Sincronizar repositório no z/OS
        run: |
          zowe rse-api-for-zowe-cli issue unix-shell \
            --cwd "${DBB_ROOT}" \
            ". ~/.profile && \
             git -c http.sslCAInfo= clone ${REPO_URL} ${APP_NAME}" \
            --host "$ZOS_HOST" \
            --port "$ZOS_PORT" \
            --user "$ZOS_USER" \
            --password "$ZOS_PASSWORD"

      - name: Verificar repositório
        run: |
          zowe rse-api-for-zowe-cli issue unix-shell \
            --cwd "${DBB_ROOT}/${APP_NAME}" \
            "pwd && \
             git status && \
             git log -1 --oneline && \
             ls -la" \
            --host "$ZOS_HOST" \
            --port "$ZOS_PORT" \
            --user "$ZOS_USER" \
            --password "$ZOS_PASSWORD"

      - name: Executar DBB Full Build
        run: |
          zowe rse-api-for-zowe-cli issue unix-shell \
            --cwd "${DBB_ROOT}/${APP_NAME}" \
            ". ~/.profile && \
             \$DBB_HOME/bin/dbb build full \
             --hlq ${DBB_HLQ}" \
            --host "$ZOS_HOST" \
            --port "$ZOS_PORT" \
            --user "$ZOS_USER" \
            --password "$ZOS_PASSWORD"