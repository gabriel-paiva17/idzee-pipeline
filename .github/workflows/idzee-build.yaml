name: IDzEE Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on:
      - self-hosted
      - Linux
      - ARM64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar ambiente
        run: |
          hostname
          node --version
          zowe --version

      - name: Executar build no z/OS
        env:
          ZOS_HOST: ${{ secrets.ZOS_HOST }}
          ZOS_PORT: ${{ secrets.ZOS_PORT }}
          ZOS_USER: ${{ secrets.ZOS_USER }}
          ZOS_PASSWORD: ${{ secrets.ZOS_PASSWORD }}
        run: |
          '$DBB_HOME/bin/dbb build user --hlq B027086.DBB "/u/b027086/dbb/idzee-pipeline/cobol/epsmlist.cbcw"' \
            --cwd "/u/b027086/dbb/MortgageApplication" \
            --host "$ZOS_HOST" \
            --port "$ZOS_PORT" \
            --base-path rseapi \
            --protocol https \
            --reject-unauthorized false 
       
        #    \
        #    --user "$ZOS_USER" \
        #    --password "$ZOS_PASSWORD"